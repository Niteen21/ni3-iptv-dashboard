<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />

 <title>Ni3 IPTV Dashboard</title>

 <link rel="icon" href="data:," />
 <link rel="stylesheet" href="styles.css" />
</head>

<body>
 <main class="app-shell">

 <!-- Login screen -->
 <section id="loginView" class="login-view">
 <div class="login-card">
 <div class="brand-mark">NI3</div>

 <p class="eyebrow">LOCAL IPTV DASHBOARD</p>
 <h1>Connect to your provider</h1>

 <p class="intro-text">
 Enter your provider details to load your authorised content.
 </p>

 <form id="loginForm">
 <label for="serverUrl">Server URL</label>
 <input
 id="serverUrl"
 type="url"
 placeholder="http://example.com:8080"
 autocomplete="url"
 required
 />

 <label for="username">Username</label>
 <input
 id="username"
 type="text"
 placeholder="Username"
 autocomplete="username"
 required
 />

 <label for="password">Password</label>
 <input
 id="password"
 type="password"
 placeholder="Password"
 autocomplete="current-password"
 required
 />

 <button id="connectBtn" class="primary-btn" type="submit">
 Connect
 </button>
 </form>

 <p id="loginMessage" class="message"></p>

 <p class="security-note">
 Your login details are stored only in this browser session.
 </p>
 </div>
 </section>

 <!-- Dashboard -->
 <section id="dashboardView" class="dashboard-view hidden">

 <header class="topbar">
 <div>
 <div class="brand-mark small">NI3</div>
 <p id="welcomeText" class="welcome-text">Welcome</p>
 <p id="accountText" class="account-text"></p>
 </div>

 <button id="logoutBtn" class="secondary-btn" type="button">
 Logout
 </button>
 </header>

 <section class="status-panel">
 <span id="connectionDot" class="connection-dot"></span>
 <span id="statusText">Connected.</span>
 </section>

 <nav class="tabs" aria-label="Content sections">
 <button class="tab active" type="button" data-section="live">
 Live TV
 </button>

 <button class="tab" type="button" data-section="movies">
 Movies
 </button>

 <button class="tab" type="button" data-section="series">
 Series
 </button>
 </nav>

 <section class="content-section">
 <div class="section-heading-row">
 <div>
 <p class="eyebrow">YOUR CONTENT</p>
 <h2 id="sectionHeading">Live TV</h2>
 </div>

 <span id="itemCount" class="item-count"></span>
 </div>

 <div class="search-row">
 <input
 id="searchInput"
 type="search"
 placeholder="Search content..."
 autocomplete="off"
 />
 </div>

 <div id="contentGrid" class="content-grid">
 <div class="empty-state">
 Connect to load your content.
 </div>
 </div>
 </section>
 </section>
 </main>

 <!-- hls.js must load before app.js -->
 <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
 <script src="app.js"></script>
</body>
</html>
